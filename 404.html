<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page Not Found | Akash Nautiyal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
        try {
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = savedTheme || systemTheme;
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
        document.documentElement.classList.add('hairline-intro');
        window.setTimeout(() => {
            document.documentElement.classList.remove('hairline-intro');
            document.dispatchEvent(new Event('hairline:intro:end'));
        }, 4000);
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@lucasmarkes/hairline@0.5.0/+esm" crossorigin>
    <link rel="stylesheet" href="/hairline-loading.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            color-scheme: light;
            --paper: #f0e0c9;
            --ink: #212529;
            --button: #212529;
            --button-ink: white;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --paper: #0a0a0a;
            --ink: #f2f0e9;
            --button: #f2f0e9;
            --button-ink: #0a0a0a;
        }
        body { 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--paper);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        h1 { 
            font-size: 6em;
            margin-bottom: 0;
            color: var(--ink);
        }
        p {
            margin-bottom: 2em;
            color: var(--ink);
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--button);
            color: var(--button-ink);
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #000;
        }
        .not-found-credit {
            position: absolute;
            bottom: 1.25rem;
            margin: 0;
            color: var(--ink);
        }
        .not-found-credit a {
            padding: 0;
            color: inherit;
            background: transparent;
            border-radius: 0;
        }
        .not-found-credit a:hover {
            color: var(--ink);
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="hairline-loading-screen" role="status" aria-label="Loading website">
        <div class="hairline-loading-figure" aria-hidden="true" inert></div>
    </div>
    <h1>404</h1>
    <p>Sorry, the page you are looking for does not exist.</p>
    <a href="/index.html">Return to Akash Nautiyal's Homepage</a>
    <footer class="hairline-credit not-found-credit">Illustrations by <a href="https://github.com/lucasmarkes/hairline" target="_blank" rel="noopener noreferrer">Lucas Markes / Hairline</a></footer>
    <script type="module" src="/hairline-loader.js"></script>
</body>
</html>
